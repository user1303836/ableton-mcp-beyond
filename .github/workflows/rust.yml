name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: Linux }
          - { os: macos-15, label: macOS }
          - { os: windows-2025, label: Windows }
    timeout-minutes: 45
    steps:
      - name: Stop Windows Defender scanning the workspace (it slows every file the build touches)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install the reference MCP SDK for interoperability tests
        run: npm ci --ignore-scripts
      - run: cargo fmt --all --check
      - run: cargo build --workspace --all-targets --locked
      - name: Tests, in a home of their own (no test reaches this machine's Live folders or ~/.kumi)
        if: runner.os != 'Windows'
        run: sh scripts/test-isolated.sh --no-fail-fast
      - name: Tests, in a home of their own (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-isolated.ps1 --no-fail-fast
      - name: Clippy (advisory while the port is under way)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: git diff --check
