name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Build exact local candidate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mcp-server
    outputs:
      artifact_sha256: ${{ steps.metadata.outputs.artifact_sha256 }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check committed whitespace in this change
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi
        working-directory: .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mcp-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run property-test
      - run: npm run coverage
      - run: npm run benchmark
      - name: Install independent FFmpeg oracle
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: npm run audio:oracle
      - run: npm run compatibility
      - run: npm run package:verify
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/candidate-a" "$RUNNER_TEMP/candidate-b" "$RUNNER_TEMP/candidate"
          mkdir "$RUNNER_TEMP/candidate-a" "$RUNNER_TEMP/candidate-b" "$RUNNER_TEMP/candidate"
          pack_a=$(npm pack --json --pack-destination "$RUNNER_TEMP/candidate-a")
          artifact=$(node -e 'let input="";process.stdin.on("data",c=>input+=c).on("end",()=>process.stdout.write(JSON.parse(input).at(-1).filename))' <<<"$pack_a")
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/repro-source"
          git -C "$RUNNER_TEMP/repro-source" checkout --quiet --detach "$GITHUB_SHA"
          pack_b=$(cd "$RUNNER_TEMP/repro-source/apps/mcp-server" && npm ci >/dev/null && npm pack --json --pack-destination "$RUNNER_TEMP/candidate-b")
          reproduced=$(node -e 'let input="";process.stdin.on("data",c=>input+=c).on("end",()=>process.stdout.write(JSON.parse(input).at(-1).filename))' <<<"$pack_b")
          test "$artifact" = "$reproduced"
          cmp "$RUNNER_TEMP/candidate-a/$artifact" "$RUNNER_TEMP/candidate-b/$artifact"
          cp "$RUNNER_TEMP/candidate-a/$artifact" "$RUNNER_TEMP/candidate/"
      - id: metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=("$RUNNER_TEMP/candidate/"*.tgz)
          test "${#artifacts[@]}" -eq 1
          artifact=${artifacts[0]}
          filename=$(basename "$artifact")
          sha=$(shasum -a 256 "$artifact" | awk '{print $1}')
          printf '{"schema":"ableton-mcp-candidate/v1","gitSha":"%s","filename":"%s","sha256":"%s"}\n' "$GITHUB_SHA" "$filename" "$sha" > "$RUNNER_TEMP/candidate/candidate-metadata.json"
          echo "artifact_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$filename" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-local-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 14

  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: [22, 24, 25]
    defaults:
      run:
        working-directory: apps/mcp-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/mcp-server/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: exact-local-candidate
          path: ${{ runner.temp }}/ableton-candidate
      - run: npm run typecheck
      - run: npm test
      - run: npm run property-test
      - run: npm run benchmark
      - run: npm run compatibility
      - name: Verify installed package from the exact shared candidate
        env:
          ABLETON_MCP_ARTIFACT: ${{ runner.temp }}/ableton-candidate/${{ needs.candidate.outputs.artifact_name }}
        run: npm run package:verify
      - name: Verify the exact shared candidate
        shell: bash
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/ableton-candidate
        run: node scripts/verify-candidate.mjs "$CANDIDATE_DIR/${{ needs.candidate.outputs.artifact_name }}" "$CANDIDATE_DIR/candidate-metadata.json" | tee "$RUNNER_TEMP/candidate-verification.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-verification-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/candidate-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify production journeys from the exact shared candidate
        env:
          ABLETON_MCP_ARTIFACT: ${{ runner.temp }}/ableton-candidate/${{ needs.candidate.outputs.artifact_name }}
        run: npm run journey:verify
      - run: npm pack --dry-run --json
      - run: npm run setup -- --output "${{ runner.temp }}/ableton-mcp-host.json"
      - shell: bash
        run: |
          printf '%s\n' '{"command":"node","args":["dist/src/cli.js"]}' > "${{ runner.temp }}/ableton-mcp-legacy.json"
          npm run migrate -- --input "${{ runner.temp }}/ableton-mcp-legacy.json" --output "${{ runner.temp }}/ableton-mcp-migrated.json"
      - name: Exercise exact version-2 migration
        shell: bash
        run: |
          node --input-type=module -e "import { writeSecretFile } from './dist/src/delivery.js'; writeSecretFile(process.argv[1], 'm'.repeat(32))" "${{ runner.temp }}/ableton-mcp-migration.secret"
          npm run migrate -- --input "${{ runner.temp }}/ableton-mcp-host.json" --output "${{ runner.temp }}/ableton-mcp-v2.json" --bridge-host 127.0.0.1 --bridge-port 19765 --realtime-port 19766 --secret-file "${{ runner.temp }}/ableton-mcp-migration.secret"
          node -e "const c=require(process.argv[1]);if(c.version!==2||c.bridge.host!=='127.0.0.1')process.exit(1)" "${{ runner.temp }}/ableton-mcp-v2.json"
      - run: npm run diagnostics -- --config "${{ runner.temp }}/ableton-mcp-host.json"

  remote-script:
    name: Python Remote Script contract / ${{ matrix.os }}
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
        working-directory: remote-script
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: exact-local-candidate
          path: ${{ runner.temp }}/ableton-candidate
      - name: Bind Python assets to the exact shared candidate
        run: python ../apps/mcp-server/scripts/verify-candidate-python.py "${{ runner.temp }}/ableton-candidate/${{ needs.candidate.outputs.artifact_name }}" "${{ runner.temp }}/ableton-candidate/candidate-metadata.json"
      - run: python -m unittest discover -s . -p 'test_*.py'
      - run: python -m compileall -q AbletonMcpBridge

  required:
    name: Required CI
    if: always()
    needs: [candidate, node, remote-script]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the complete exact-candidate contract matrix
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.candidate.result }}" = "success"
          test "${{ needs.node.result }}" = "success"
          test "${{ needs.remote-script.result }}" = "success"
