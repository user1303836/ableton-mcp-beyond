name: CI

on:
  push:
    branches: ["feat/comprehensive-ableton-mcp"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/mcp-server/package-lock.json
      - run: npm ci
      - run: npm run compatibility
      - run: npm run typecheck
      - run: npm test
      - run: npm run property-test
      - run: npm run benchmark
      - run: npm run package:verify
      - run: npm pack --dry-run
