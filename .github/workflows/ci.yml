name: CI

on:
  push:
  pull_request:

jobs:
  candidate:
    name: Build exact private candidate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mcp-server
    outputs:
      artifact_sha256: ${{ steps.metadata.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mcp-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run property-test
      - run: npm run coverage
      - run: npm run benchmark
      - name: Install independent FFmpeg oracle
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: npm run audio:oracle
      - run: npm run compatibility
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/candidate-a" "$RUNNER_TEMP/candidate-b" "$RUNNER_TEMP/candidate"
          mkdir "$RUNNER_TEMP/candidate-a" "$RUNNER_TEMP/candidate-b" "$RUNNER_TEMP/candidate"
          npm pack --json --pack-destination "$RUNNER_TEMP/candidate-a" >/dev/null
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/repro-source"
          git -C "$RUNNER_TEMP/repro-source" checkout --quiet --detach "$GITHUB_SHA"
          (cd "$RUNNER_TEMP/repro-source/apps/mcp-server" && npm ci && npm pack --json --pack-destination "$RUNNER_TEMP/candidate-b" >/dev/null)
          cmp "$RUNNER_TEMP/candidate-a/ableton-mcp-mcp-server-0.1.0.tgz" "$RUNNER_TEMP/candidate-b/ableton-mcp-mcp-server-0.1.0.tgz"
          cp "$RUNNER_TEMP/candidate-a/ableton-mcp-mcp-server-0.1.0.tgz" "$RUNNER_TEMP/candidate/"
      - id: metadata
        shell: bash
        run: |
          set -euo pipefail
          sha=$(shasum -a 256 "$RUNNER_TEMP/candidate/ableton-mcp-mcp-server-0.1.0.tgz" | awk '{print $1}')
          printf '{"schema":"ableton-mcp-candidate/v1","gitSha":"%s","filename":"ableton-mcp-mcp-server-0.1.0.tgz","sha256":"%s"}\n' "$GITHUB_SHA" "$sha" > "$RUNNER_TEMP/candidate/candidate-metadata.json"
          echo "artifact_sha256=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: exact-private-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 14

  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: [22, 24, 25]
    defaults:
      run:
        working-directory: apps/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/mcp-server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: exact-private-candidate
          path: ${{ runner.temp }}/ableton-candidate
      - run: npm run typecheck
      - run: npm test
      - run: npm run property-test
      - run: npm run benchmark
      - run: npm run compatibility
      - name: Verify installed package from the exact shared candidate
        env:
          ABLETON_MCP_ARTIFACT: ${{ runner.temp }}/ableton-candidate/ableton-mcp-mcp-server-0.1.0.tgz
        run: npm run package:verify
      - name: Verify the exact shared candidate
        shell: bash
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/ableton-candidate
        run: node scripts/verify-candidate.mjs "$CANDIDATE_DIR/ableton-mcp-mcp-server-0.1.0.tgz" "$CANDIDATE_DIR/candidate-metadata.json" | tee "$RUNNER_TEMP/candidate-verification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-verification-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/candidate-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify production journeys from the exact shared candidate
        env:
          ABLETON_MCP_ARTIFACT: ${{ runner.temp }}/ableton-candidate/ableton-mcp-mcp-server-0.1.0.tgz
        run: npm run journey:verify
      - run: npm pack --dry-run --json
      - run: npm run setup -- --output "${{ runner.temp }}/ableton-mcp-host.json"
      - shell: bash
        run: |
          printf '%s\n' '{"command":"node","args":["dist/src/cli.js"]}' > "${{ runner.temp }}/ableton-mcp-legacy.json"
          npm run migrate -- --input "${{ runner.temp }}/ableton-mcp-legacy.json" --output "${{ runner.temp }}/ableton-mcp-migrated.json"
      - name: Exercise exact version-2 migration
        shell: bash
        run: |
          node --input-type=module -e "import { writeSecretFile } from './dist/src/delivery.js'; writeSecretFile(process.argv[1], 'm'.repeat(32))" "${{ runner.temp }}/ableton-mcp-migration.secret"
          npm run migrate -- --input "${{ runner.temp }}/ableton-mcp-host.json" --output "${{ runner.temp }}/ableton-mcp-v2.json" --bridge-host 127.0.0.1 --bridge-port 19765 --realtime-port 19766 --secret-file "${{ runner.temp }}/ableton-mcp-migration.secret"
          node -e "const c=require(process.argv[1]);if(c.version!==2||c.bridge.host!=='127.0.0.1')process.exit(1)" "${{ runner.temp }}/ableton-mcp-v2.json"
      - run: npm run diagnostics -- --config "${{ runner.temp }}/ableton-mcp-host.json"
      - run: git diff --check
        working-directory: .
  remote-script:
    name: Python Remote Script contract / ${{ matrix.os }}
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
        working-directory: remote-script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: exact-private-candidate
          path: ${{ runner.temp }}/ableton-candidate
      - name: Bind Python assets to the exact shared candidate
        run: python ../apps/mcp-server/scripts/verify-candidate-python.py "${{ runner.temp }}/ableton-candidate/ableton-mcp-mcp-server-0.1.0.tgz" "${{ runner.temp }}/ableton-candidate/candidate-metadata.json"
      - run: python -m unittest discover -s . -p 'test_*.py'
      - run: python -m compileall -q AbletonMcpBridge
